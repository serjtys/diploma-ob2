{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <!-- Логотип -->
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'core:post_list' %}">
            <img src="{% static 'images/logo.png' %}" alt="Logo" height="30" class="me-2">
            ContentPlatform
        </a>

        <!-- Мобильное меню -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Навигация -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'core:post_list' %}">📖 Главная</a>
                </li>
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:subscribe' %}">💎 Подписка</a>
                </li>
                {% endif %}
            </ul>

            <!-- Правая часть -->
            <ul class="navbar-nav">
                {% if user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                            <span class="badge bg-light text-dark me-2">👤</span>
                            {{ user.phone_number }}
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">📊 Профиль</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="{% url 'users:logout' %}">🚪 Выйти</a></li>
                        </ul>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:login' %}">🔑 Войти</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:register' %}">📝 Регистрация</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
