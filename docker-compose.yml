services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/diploma_db
      - SECRET_KEY=your-secret-key-here-change-in-production
      - REDIS_URL=redis://redis:6379/1
      - DEBUG=1
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    ports:
      - "5433:5432"  # Локальный порт 5433 чтобы не конфликтовать с GitHub Actions
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=diploma_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:7-alpine
    # УБИРАЕМ ports - Redis будет доступен только внутри docker сети

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume: