{% extends 'base.html' %}

{% block title %}Удалить пост - ContentPlatform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white py-3">
                <h4 class="mb-0">🗑️ Удалить пост</h4>
            </div>
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <span style="font-size: 4rem;">⚠️</span>
                </div>
                
                <h5 class="mb-3">Вы уверены что хотите удалить этот пост?</h5>
                
                <div class="card mb-4">
                    <div class="card-body text-start">
                        <h6>{{ post.title }}</h6>
                        <p class="text-muted small mb-0">
                            {{ post.content|truncatewords:30 }}
                        </p>
                    </div>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger btn-lg">
                            🗑️ Да, удалить
                        </button>
                        <a href="{% url 'core:post_detail' post.id %}" class="btn btn-secondary btn-lg">
                            ❌ Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
